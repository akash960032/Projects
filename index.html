<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoadWay Travels</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
--bg:#eef2f8;--ink:#101a33;--mut:#5a6785;--card:#fff;--line:#d6deec;--pri:#1d4ed8;--prit:#fff;--acc:#f59e0b;--ok:#15803d;--hero:#101a33;--herot:#eaf0ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--ink:#e8edfb;--mut:#9aa7c7;--card:#151d36;--line:#27325a;--pri:#5b8cff;--prit:#06102e;--acc:#fbbf24;--ok:#4ade80;--hero:#0f1730}}
:root[data-theme="dark"]{--bg:#0b1020;--ink:#e8edfb;--mut:#9aa7c7;--card:#151d36;--line:#27325a;--pri:#5b8cff;--prit:#06102e;--acc:#fbbf24;--ok:#4ade80;--hero:#0f1730}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.w{max-width:620px;margin:0 auto;padding:0 14px}
header{background:var(--hero);color:var(--herot);padding:22px 0 64px}
header .row{display:flex;justify-content:space-between;align-items:center}
.logo{font:700 22px Georgia,serif}
.tabs{display:flex;gap:6px}
.tabs button{background:transparent;color:var(--herot);border:1px solid #3a4a80;border-radius:16px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#101a33;border-color:var(--acc);font-weight:600}
header h1{font:700 28px/1.15 Georgia,serif;margin:18px 0 0}
.road{height:6px;margin-top:16px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--acc) 0 22px,transparent 22px 40px);opacity:.8}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.search{margin-top:-46px;box-shadow:0 8px 24px rgba(16,26,51,.18)}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
select,input[type=date],input[type=time],input[type=text],input[type=number]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.swap{display:block;margin:-2px auto 6px;background:var(--bg);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;color:var(--ink);cursor:pointer}
.trip{display:flex;gap:14px;font-size:14px;color:var(--mut);margin:6px 0 0}
.trip b{color:var(--ink)}
h2{font:700 20px Georgia,serif;margin:20px 0 10px}
.veh{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;color:var(--ink);font:inherit;cursor:pointer}
.veh.on{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 20%,transparent)}
.veh .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex:none}
.veh .mid{flex:1;min-width:0}
.veh .nm{font-weight:700}
.veh .sub{font-size:13px;color:var(--mut)}
.veh .pr{text-align:right;font:700 18px Georgia,serif}
.veh .pr small{display:block;font:12px system-ui;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin-right:4px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border:0}
.pay{display:flex;gap:8px}
.pay button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.pay button.on{border-color:var(--pri);font-weight:700}
.fare div{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}
.fare .t{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font:700 20px Georgia,serif}
.promo{display:flex;gap:8px}
.promo button,.cta{background:var(--pri);color:var(--prit);border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
.msg{font-size:13px;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .amt{flex:1;font-size:13px;color:var(--mut)}
.bar .amt b{display:block;font:700 24px Georgia,serif;color:var(--ink)}
.bar .cta{background:var(--acc);color:#101a33;padding:14px 26px;font-size:16px}
.bar .cta:disabled{opacity:.5}
.ticket{border:2px dashed var(--pri);border-radius:16px;padding:16px;background:var(--card);margin-bottom:12px}
.ticket .top{display:flex;justify-content:space-between;align-items:center}
.ticket .ok{color:var(--ok);font-weight:700}
.ticket .rt{font:700 20px Georgia,serif;margin:8px 0}
.ticket .id{font:14px ui-monospace,monospace;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.ov{position:fixed;inset:0;background:rgba(5,10,25,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:18px;padding:20px;max-width:420px;width:100%;max-height:90%;overflow:auto}
.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri);border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer;width:100%;margin-top:8px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none}
</style></head>
<body>
<header><div class="w">
<div class="row"><div class="logo">🛣️ RoadWay</div>
<div class="tabs"><button id="tBook" class="on">Book</button><button id="tMy">My trips</button></div></div>
<h1>Where to today?</h1><div class="road"></div>
</div></header>

<div class="w" id="vBook">
<div class="panel search">
<div class="g2" style="grid-template-columns:1fr;margin-bottom:0">
<div><label for="from">From</label><select id="from"></select></div>
<button class="swap" id="swap" aria-label="Swap places">⇅</button>
<div><label for="to">To</label><select id="to"></select></div></div>
<div class="g2" style="margin-top:10px"><div><label for="date">Date</label><input type="date" id="date"></div>
<div><label for="time">Pickup time</label><input type="time" id="time" value="09:00"></div></div>
<div class="g2" style="margin-bottom:0"><div><label for="pax">Passengers</label><input type="number" id="pax" min="1" max="40" value="2"></div>
<div><label>&nbsp;</label><div class="trip"><span>Distance <b id="km">0</b> km</span><span>~<b id="hr">0</b> h</span></div></div></div>
</div>

<h2>Choose your vehicle</h2>
<div id="vehs"></div>

<h2>Trip options</h2>
<div class="panel">
<div class="opt"><span>❄️ Air conditioning (+5%)</span><input type="checkbox" id="ac" checked></div>
<div class="opt"><span>🔁 Round trip (return same day)</span><input type="checkbox" id="rt"></div>
<div class="opt"><span>🧳 Extra luggage (+₹100)</span><input type="checkbox" id="lug"></div>
</div>

<h2>Promo code</h2>
<div class="panel"><div class="promo"><input type="text" id="code" placeholder="Try SAVE20, TRAVEL10 or FIRST50"><button id="apply">Apply</button></div><div class="msg" id="pm"></div></div>

<h2>Payment</h2>
<div class="panel pay" id="pay"><button class="on" data-m="UPI">📱 UPI</button><button data-m="Card">💳 Card</button><button data-m="Cash">💵 Cash</button></div>

<h2>Fare details</h2>
<div class="panel fare" id="fare"></div>
</div>

<div class="w hide" id="vMy"><h2>My trips</h2><div id="trips"></div></div>

<div class="bar" id="bar"><div class="in"><div class="amt">Total payable<b id="bt">₹0</b></div><button class="cta" id="book">Book now</button></div></div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
var $=function(i){return document.getElementById(i)};
var C={Chennai:[13.08,80.27],Bengaluru:[12.97,77.59],Hyderabad:[17.39,78.49],Mumbai:[19.08,72.88],Pune:[18.52,73.86],Delhi:[28.61,77.21],Kolkata:[22.57,88.36],Coimbatore:[11.02,76.96],Madurai:[9.92,78.12],Kochi:[9.93,76.27]};
var V=[
{id:"bike",n:"Bike taxi",e:"🏍️",c:"#fde68a",seat:1,base:15,km:3.5,tag:"Fastest in traffic",pp:0},
{id:"auto",n:"Auto rickshaw",e:"🛺",c:"#bbf7d0",seat:3,base:20,km:6,tag:"Short city trips",pp:0},
{id:"mini",n:"Mini cab",e:"🚕",c:"#fed7aa",seat:4,base:30,km:8,tag:"Hatchback, AC",pp:0},
{id:"sedan",n:"Sedan",e:"🚘",c:"#bfdbfe",seat:4,base:40,km:10,tag:"Comfort ride",pp:0},
{id:"suv",n:"SUV",e:"🚙",c:"#ddd6fe",seat:6,base:60,km:13,tag:"Family and luggage",pp:0},
{id:"tt",n:"Tempo Traveller",e:"🚐",c:"#fbcfe8",seat:12,base:100,km:18,tag:"Groups and tours",pp:0},
{id:"bus",n:"Express bus",e:"🚌",c:"#a5f3fc",seat:40,base:25,km:1.3,tag:"Per seat, cheapest",pp:1}];
var st={veh:"mini",pay:"UPI",disc:0,off:0,code:""};
var trips=[];try{trips=JSON.parse(localStorage.getItem("rw_trips")||"[]")}catch(e){}
function fillCities(){var h=Object.keys(C).map(function(c){return"<option>"+c+"</option>"}).join("");$("from").innerHTML=h;$("to").innerHTML=h;$("to").selectedIndex=1}
function dist(){var a=C[$("from").value],b=C[$("to").value],R=6371,r=Math.PI/180;
var dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;
var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)*Math.sin(dn/2);
return Math.round(2*R*Math.asin(Math.sqrt(x))*1.25)}
function calc(v){var km=dist(),pax=Math.max(1,+$("pax").value||1),f;
if(v.pp)f=(v.base+v.km*km)*pax;else f=v.base+v.km*km;
if(km===0)f=0;return{km:km,pax:pax,f:f}}
function money(n){return"₹"+Math.round(n).toLocaleString("en-IN")}
function totals(){var v=V.filter(function(x){return x.id===st.veh})[0],c=calc(v),
ac=$("ac").checked&&!v.pp?c.f*0.05:0,sub=c.f+ac;
if($("rt").checked)sub=sub*1.6;
var lug=$("lug").checked?100:0;sub+=lug;
var d=sub*st.disc+st.off;d=Math.min(d,sub);
var gst=(sub-d)*0.05,tot=sub-d+gst;
return{v:v,c:c,base:c.f,ac:ac,lug:lug,rtx:$("rt").checked,sub:sub,d:d,gst:gst,tot:tot}}
function render(){var km=dist();$("km").textContent=km;$("hr").textContent=(km/55).toFixed(1);
$("vehs").innerHTML=V.map(function(v){var c=calc(v),fit=v.pp?c.pax<=v.seat:c.pax<=v.seat;
return'<button class="veh'+(st.veh===v.id?" on":"")+'" data-v="'+v.id+'"'+(fit?"":' style="opacity:.5"')+'><div class="ic" style="background:'+v.c+'">'+v.e+'</div><div class="mid"><div class="nm">'+v.n+'</div><div class="sub">'+(v.pp?"Up to "+v.seat+" seats":v.seat+" seats")+' · '+(fit?v.tag:"Needs more seats")+'</div></div><div class="pr">'+money(c.f)+'<small>'+(v.pp?c.pax+" seat(s)":"estimated")+'</small></div></button>'}).join("");
var t=totals();
$("fare").innerHTML='<div><span>Base fare ('+t.c.km+' km)</span><span>'+money(t.base)+'</span></div>'+
(t.ac?'<div><span>AC charge</span><span>'+money(t.ac)+'</span></div>':'')+
(t.rtx?'<div><span>Round trip</span><span>×1.6</span></div>':'')+
(t.lug?'<div><span>Extra luggage</span><span>'+money(t.lug)+'</span></div>':'')+
(t.d?'<div style="color:var(--ok)"><span>Discount</span><span>−'+money(t.d)+'</span></div>':'')+
'<div><span>GST 5%</span><span>'+money(t.gst)+'</span></div><div class="t"><span>Total</span><span>'+money(t.tot)+'</span></div>';
$("bt").textContent=money(t.tot);
$("book").disabled=t.c.km===0||t.c.pax>t.v.seat;
$("book").textContent=t.c.pax>t.v.seat?"Too many people":"Book now"}
function renderTrips(){$("trips").innerHTML=trips.length?trips.map(ticket).join(""):'<div class="empty">No trips yet.<br>Book your first ride from the Book tab.</div>'}
function ticket(b){return'<div class="ticket"><div class="top"><span class="ok">✔ Confirmed</span><span class="id">'+b.id+'</span></div><div class="rt">'+b.from+' → '+b.to+'</div><div>'+b.e+' '+b.veh+' · '+b.pax+' passenger(s)'+(b.rt?' · Round trip':'')+'</div><div style="color:var(--mut);font-size:14px">'+b.date+' at '+b.time+' · '+b.km+' km · Paid by '+b.pay+'</div><div style="font:700 20px Georgia,serif;margin-top:8px">'+money(b.tot)+'</div></div>'}
function save(){try{localStorage.setItem("rw_trips",JSON.stringify(trips))}catch(e){}}
$("vehs").onclick=function(e){var b=e.target.closest(".veh");if(!b)return;st.veh=b.dataset.v;render()};
["from","to","pax","ac","rt","lug"].forEach(function(i){$(i).oninput=render});
$("swap").onclick=function(){var a=$("from").selectedIndex;$("from").selectedIndex=$("to").selectedIndex;$("to").selectedIndex=a;render()};
$("pay").onclick=function(e){var b=e.target.closest("button");if(!b)return;st.pay=b.dataset.m;[].forEach.call($("pay").children,function(x){x.classList.toggle("on",x===b)})};
$("apply").onclick=function(){var c=$("code").value.trim().toUpperCase(),m=$("pm");st.disc=0;st.off=0;
if(c==="SAVE20"){st.disc=0.2;m.style.color="var(--ok)";m.textContent="20% off applied."}
else if(c==="TRAVEL10"){st.disc=0.1;m.style.color="var(--ok)";m.textContent="10% off applied."}
else if(c==="FIRST50"){st.off=50;m.style.color="var(--ok)";m.textContent="₹50 off applied."}
else{m.style.color="#dc2626";m.textContent=c?"Code not valid. Try SAVE20, TRAVEL10 or FIRST50.":"Enter a code first."}
render()};
$("book").onclick=function(){var t=totals();
$("modal").innerHTML='<h2 style="margin-top:0">Confirm booking</h2><div class="fare"><div><span>Route</span><span>'+$("from").value+' → '+$("to").value+'</span></div><div><span>Vehicle</span><span>'+t.v.n+'</span></div><div><span>When</span><span>'+$("date").value+' '+$("time").value+'</span></div><div><span>Passengers</span><span>'+t.c.pax+'</span></div><div><span>Payment</span><span>'+st.pay+'</span></div><div class="t"><span>Pay</span><span>'+money(t.tot)+'</span></div></div><button class="cta" id="ok" style="width:100%;margin-top:14px">Pay '+money(t.tot)+'</button><button class="ghost" id="no">Go back</button>';
$("ov").classList.add("show");
$("no").onclick=function(){$("ov").classList.remove("show")};
$("ok").onclick=function(){var b={id:"RW"+Math.random().toString(36).slice(2,8).toUpperCase(),from:$("from").value,to:$("to").value,veh:t.v.n,e:t.v.e,pax:t.c.pax,rt:t.rtx,date:$("date").value,time:$("time").value,km:t.c.km,pay:st.pay,tot:t.tot};
trips.unshift(b);save();
$("modal").innerHTML='<div style="text-align:center;font-size:48px">🎉</div><h2 style="text-align:center;margin:4px 0 12px">Booking confirmed</h2>'+ticket(b)+'<button class="cta" id="mt" style="width:100%">View my trips</button>';
$("mt").onclick=function(){$("ov").classList.remove("show");show("my")}}};
function show(w){var my=w==="my";$("vBook").classList.toggle("hide",my);$("vMy").classList.toggle("hide",!my);$("bar").classList.toggle("hide",my);$("tBook").classList.toggle("on",!my);$("tMy").classList.toggle("on",my);if(my)renderTrips();window.scrollTo(0,0)}
$("tBook").onclick=function(){show("book")};$("tMy").onclick=function(){show("my")};
var d=new Date();d.setDate(d.getDate()+1);$("date").value=d.toISOString().slice(0,10);$("date").min=new Date().toISOString().slice(0,10);
fillCities();render();
</script>
</body></html>
